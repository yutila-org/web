name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name web

      - name: Send Telemetry Payload
        if: always()
        env:
          RELAY_TOKEN: ${{ secrets.WAZUH_RELAY_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          curl -X POST "https://telemetry.yutila.com" \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            -H "Content-Type: application/x-ndjson" \
            -d '{"event": "cloudflare_build_'"$OUTCOME"'", "run_id": "${{ github.run_id }}", "github": {"repo": "${{ github.repository }}", "actor": "${{ github.actor }}", "org": "${{ github.repository_owner }}"}}'