name: "Stage 1: Secret Scan"

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: >
          docker run --rm
          -v ${{ github.workspace }}:/code
          zricethezav/gitleaks:latest detect
          --source="/code"
          --verbose
          --report-format=sarif
          --report-path="/code/gitleaks.sarif"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
